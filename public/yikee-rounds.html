<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCKY GO - เลือกเลือกรอบยี่กี</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background-color: #0b0f19; color: #fff; margin: 0; padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .back-btn { background: #1e293b; border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }

    .rounds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .round-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
    .round-card:hover { border-color: #fbbf24; background: #334155; }
    
    .status-badge { position: absolute; top: -10px; right: 50%; transform: translateX(50%); background: #0284c7; color: white; padding: 2px 10px; border-radius: 10px; font-size: 10px; font-weight: bold; }
    .round-title { font-weight: bold; font-size: 14px; margin-top: 5px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .round-timer { font-size: 20px; font-weight: bold; color: #fbbf24; margin-bottom: 5px; }
    .close-time { font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="location.href='/lotto-menu.html'">← กลับ</button>
      <h3 style="margin:0; font-size: 18px;">⚡ ยี่กี 1 นาที (เปิดรับแทง)</h3>
    </div>

    <div class="rounds-grid" id="roundsContainer">
      <!-- Render รอบแทงแบบ Real-time -->
    </div>
  </div>

<script>
  // จำลองรายการรอบแทงยี่กี (เหมือนในภาพที่คุณส่งมา)
  const roundsData = [
    { round: 122, timer: '00:00:25', closeTime: '16:05 น.' },
    { round: 123, timer: '00:01:25', closeTime: '16:06 น.' },
    { round: 124, timer: '00:02:25', closeTime: '16:07 น.' },
    { round: 125, timer: '00:03:25', closeTime: '16:08 น.' },
    { round: 126, timer: '00:04:25', closeTime: '16:09 น.' },
    { round: 127, timer: '00:05:25', closeTime: '16:10 น.' }
  ];

  const container = document.getElementById('roundsContainer');
  roundsData.forEach(r => {
    const card = document.createElement('div');
    card.className = 'round-card';
    card.onclick = () => function selectRound(roundNumber, type) {
  // นำทางไปยังหน้า betting.html พร้อมส่งค่ารอบและประเภทหวยไปทาง URL
  window.location.href = `/betting.html?type=${encodeURIComponent(type || '1m')}&round=${roundNumber}`;
}
    card.innerHTML = `
      <div class="status-badge">เปิดรับแทง</div>
      <div class="round-title">🔵 ยี่กี รอบที่ ${r.round}</div>
      <div class="round-timer">${r.timer}</div>
      <div class="close-time">ปิดรับ: ${r.closeTime}</div>
    `;
    container.appendChild(card);
  });
</script>
</body>
</html>
