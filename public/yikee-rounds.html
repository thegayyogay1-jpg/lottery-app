<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUCKY GO - เลือกรอบยี่กี</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Thonburi, Tahoma, sans-serif; user-select: none; }
    body { background-color: #0b0f19; color: #fff; margin: 0; padding: 15px; padding-bottom: 40px; }
    .container { max-width: 500px; margin: 0 auto; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
    .back-btn { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }

    .rounds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .round-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; position: relative; }
    .round-card.open { border-color: #38bdf8; }
    .round-card.open:hover { border-color: #fbbf24; background: #334155; }
    .round-card.waiting { border-color: #f59e0b; opacity: 0.9; cursor: not-allowed; }
    .round-card.closed { border-color: #10b981; opacity: 0.85; cursor: default; background: #0f172a; }
    
    .status-badge { position: absolute; top: -10px; right: 50%; transform: translateX(50%); padding: 2px 10px; border-radius: 10px; font-size: 10px; font-weight: bold; white-space: nowrap; }
    .status-badge.open { background: #0284c7; color: white; }
    .status-badge.waiting { background: #d97706; color: white; }
    .status-badge.closed { background: #059669; color: white; }

    .round-title { font-weight: bold; font-size: 14px; margin-top: 5px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .round-timer { font-size: 20px; font-weight: bold; color: #fbbf24; margin-bottom: 5px; font-family: monospace; }
    .close-time { font-size: 11px; color: #94a3b8; }
    .result-box { font-size: 15px; font-weight: bold; color: #4ade80; margin-top: 4px; background: rgba(16, 185, 129, 0.1); padding: 4px; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <button class="back-btn" onclick="location.href='/lotto-menu.html'">← กลับ</button>
      <h3 id="pageTitle" style="margin:0; font-size: 18px; color: #fbbf24;">⚡ ยี่กี</h3>
    </div>

    <div class="rounds-grid" id="roundsContainer">
      <!-- Render รอบแทงแบบ Real-time -->
    </div>
  </div>

<script>
  // อ่านค่าจาก URL ?type=1m หรือ ?type=5m (ถ้าไม่ระบุจะเลือก 1m ให้อัตโนมัติ)
  const urlParams = new URLSearchParams(window.location.search);
  const LOTTO_TYPE = urlParams.get('type') === '5m' ? '5m' : '1m';

  // ตั้งค่าระยะเวลาและจำนวนรอบต่อวันตามประเภท
  const ROUND_DURATION = LOTTO_TYPE === '5m' ? 300 : 60; // 5 นาที (300 วิ) หรือ 1 นาที (60 วิ)
  const TOTAL_ROUNDS = LOTTO_TYPE === '5m' ? 288 : 1440; // 288 รอบ หรือ 1440 รอบต่อวัน
  const STORAGE_KEY = `yikee_${LOTTO_TYPE}_results`;

  let roundsState = {};

  // แสดงหัวข้อตามประเภท
  document.getElementById('pageTitle').innerText = LOTTO_TYPE === '5m' ? '⚡ ยี่กี 5 นาที' : '⚡ ยี่กี 1 นาที';

  // สุ่มผลหวย 3 ตัวบน และ 2 ตัวล่าง
  function generateRandomResult() {
    const top3 = Math.floor(Math.random() * 1000).toString().padStart(3, '0');
    const bottom2 = Math.floor(Math.random() * 100).toString().padStart(2, '0');
    return `${top3} - ${bottom2}`;
  }

  // คำนวณเวลาและสถานะรอบตามเวลาจริงของเครื่อง
  function syncRoundsWithTime() {
    const now = Math.floor(Date.now() / 1000);
    
    // เวลาเริ่มต้น 00:00:00 น. ของวันนี้
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const startOfDay = Math.floor(today.getTime() / 1000);
    
    const savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

    for (let i = 1; i <= TOTAL_ROUNDS; i++) {
      const startTime = startOfDay + ((i - 1) * ROUND_DURATION);
      const endTime = startTime + ROUND_DURATION;

      if (!roundsState[i]) {
        roundsState[i] = { status: 'open', result: null, endTime: endTime };
      }

      roundsState[i].endTime = endTime;

      if (now < endTime) {
        if (roundsState[i].status !== 'waiting') {
          roundsState[i].status = 'open';
        }
      } else {
        if (savedState[i]) {
          roundsState[i].status = 'closed';
          roundsState[i].result = savedState[i];
        } else if (roundsState[i].status !== 'closed' && roundsState[i].status !== 'waiting') {
          roundsState[i].status = 'closed';
          roundsState[i].result = generateRandomResult();
          savedState[i] = roundsState[i].result;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(savedState));
        }
      }
    }
  }

  function selectRound(roundNumber, status) {
    if (status !== 'open') {
      if (status === 'closed') alert(`รอบที่ ${roundNumber} ออกผลรางวัลแล้ว (${roundsState[roundNumber].result})`);
      else alert(`รอบที่ ${roundNumber} ปิดรับแทงแล้ว กำลังรอคำนวณผล`);
      return;
    }
    window.location.href = `/betting.html?type=${LOTTO_TYPE}&round=${roundNumber}`;
  }

  function formatTimer(seconds) {
    if (seconds <= 0) return '00:00:00';
    const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
    const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function renderRounds() {
    const container = document.getElementById('roundsContainer');
    container.innerHTML = '';
    const now = Math.floor(Date.now() / 1000);

    // ค้นหารอบปัจจุบัน
    let currentRound = 1;
    for (let r = 1; r <= TOTAL_ROUNDS; r++) {
      if (now < roundsState[r].endTime) {
        currentRound = r;
        break;
      }
    }

    // กำหนดรอบที่จะแสดง: ค้างรอบล่าสุดที่เพิ่งออกผลไว้ 1 รอบ + รอบปัจจุบันและรอบอนาคตถัดไปอีก 10 รอบ
    let displayRounds = [];
    
    let latestClosedRound = currentRound - 1;
    if (latestClosedRound >= 1) {
      displayRounds.push(latestClosedRound);
    }
    
    for (let r = currentRound; r <= Math.min(currentRound + 10, TOTAL_ROUNDS); r++) {
      displayRounds.push(r);
    }

    displayRounds.forEach(r => {
      let data = roundsState[r];
      let remaining = data.endTime - now;

      // ตรวจสอบเมื่อเวลาหมด
      if (remaining <= 0 && data.status === 'open') {
        data.status = 'waiting';
        
        // จำลองเวลาสุ่มออกผลรางวัล 3 วินาทีหลังปิดรอบ
        setTimeout(() => {
          data.status = 'closed';
          data.result = generateRandomResult();
          
          const savedState = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          savedState[r] = data.result;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(savedState));
          
          renderRounds();
        }, 3000);
      }

      const card = document.createElement('div');
      card.className = `round-card ${data.status}`;
      card.onclick = () => selectRound(r, data.status);

      let statusBadge = '';
      let content = '';

      if (data.status === 'open') {
        statusBadge = `<div class="status-badge open">เปิดรับแทง</div>`;
        content = `
          <div class="round-title">🔵 ยี่กี รอบที่ ${r}</div>
          <div class="round-timer" id="timer-${r}">${formatTimer(remaining)}</div>
          <div class="close-time">กดเพื่อเลือกแทง</div>
        `;
      } else if (data.status === 'waiting') {
        statusBadge = `<div class="status-badge waiting">รอออกผล</div>`;
        content = `
          <div class="round-title">🔵 ยี่กี รอบที่ ${r}</div>
          <div class="round-timer" style="color:#f59e0b;">กำลังออกผล...</div>
          <div class="close-time">ปิดรับแทงแล้ว</div>
        `;
      } else {
        statusBadge = `<div class="status-badge closed">ล่าสุด</div>`;
        content = `
          <div class="round-title">🔵 ยี่กี รอบที่ ${r}</div>
          <div class="result-box">ผล: ${data.result}</div>
          <div class="close-time">ออกผลเรียบร้อย</div>
        `;
      }

      card.innerHTML = statusBadge + content;
      container.appendChild(card);
    });
  }

  // ตัวนับถอยหลังหลัก อัปเดตทุก 1 วินาที
  function startClock() {
    syncRoundsWithTime();
    renderRounds();

    setInterval(() => {
      syncRoundsWithTime();
      const now = Math.floor(Date.now() / 1000);
      let needReRender = false;

      for (let r in roundsState) {
        let data = roundsState[r];
        if (data.status === 'open') {
          let remaining = data.endTime - now;
          const timerEl = document.getElementById(`timer-${r}`);
          if (timerEl) {
            timerEl.innerText = formatTimer(remaining);
          }
          if (remaining <= 0) {
            needReRender = true;
          }
        }
      }

      if (needReRender) {
        renderRounds();
      }
    }, 1000);
  }

  window.addEventListener('DOMContentLoaded', startClock);
</script>
</body>
</html>
