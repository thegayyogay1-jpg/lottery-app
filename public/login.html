<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ</title>
  <style>
    body { font-family: sans-serif; max-width: 350px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    #message { margin-top: 15px; text-align: center; color: red; font-weight: bold; }
  </style>
</head>
<body>

  <h2>เข้าสู่ระบบ</h2>
  <form id="loginForm">
    <div class="form-group">
      <label>ชื่อผู้ใช้งาน:</label>
      <input type="text" id="username" required placeholder="กรอกชื่อผู้ใช้">
    </div>
    <div class="form-group">
      <label>รหัสผ่าน:</label>
      <input type="password" id="password" required placeholder="กรอกรหัสผ่าน">
    </div>
    <button type="submit" id="submitBtn">เข้าสู่ระบบ</button>
  </form>

  <div id="message"></div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      // 1. สำคัญมาก! ป้องกันไม่ให้ฟอร์ม รีเฟรช หน้าเว็บอัตโนมัติ
      e.preventDefault(); 

      const usernameInput = document.getElementById('username').value;
      const passwordInput = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      const submitBtn = document.getElementById('submitBtn');

      messageDiv.style.color = '#555';
      messageDiv.innerText = 'กำลังตรวจสอบข้อมูล...';
      submitBtn.disabled = true;

      try {
        // 2. ยิง API ไปที่ Backend (/api/login)
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput,
            password: passwordInput
          })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          // 3. บันทึกข้อมูล Token และ Role ลง LocalStorage
          localStorage.setItem('token', data.token);
          localStorage.setItem('role', data.user.role);
          localStorage.setItem('username', data.user.username);

          messageDiv.style.color = 'green';
          messageDiv.innerText = 'ล็อกอินสำเร็จ! กำลังนำคุณไป...';

          // 4. แยกการย้ายหน้าตามระดับสิทธิ์ (Role)
          setTimeout(() => {
            if (data.user.role === 'admin' || data.user.role === 'superadmin') {
              window.location.href = '/admin.html';
            } else {
              window.location.href = '/index.html';
            }
          }, 500);

        } else {
          // แจ้งเตือนกรณีรหัสผ่านผิดหรือหาผู้ใช้ไม่เจอ
          messageDiv.style.color = 'red';
          messageDiv.innerText = data.message || 'เกิดข้อผิดพลาดในการล็อกอิน';
          submitBtn.disabled = false;
        }

      } catch (err) {
        console.error('Login Error:', err);
        messageDiv.style.color = 'red';
        messageDiv.innerText = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
