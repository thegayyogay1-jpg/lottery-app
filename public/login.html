<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ</title>
  <style>
    body { font-family: sans-serif; max-width: 350px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background-color: #218838; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
    .link { margin-top: 15px; text-align: center; font-size: 14px; }
  </style>
</head>
<body>
  <h2>เข้าสู่ระบบ</h2>
  <form id="loginForm">
    <div class="form-group">
      <label>ชื่อผู้ใช้งาน (Username):</label>
      <input type="text" id="username" required>
    </div>
    <div class="form-group">
      <label>รหัสผ่าน (Password):</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit">เข้าสู่ระบบ</button>
  </form>
  <div id="status"></div>
  <div class="link">
    ยังไม่มีบัญชี? <a href="/register.html">สมัครสมาชิกที่นี่</a>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = 'กำลังตรวจสอบ...';

      const data = {
        username: document.getElementById('username').value,
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();

        if (result.success) {
          statusDiv.style.color = 'green';
          statusDiv.innerText = 'เข้าสู่ระบบสำเร็จ';

          // รองรับโครงสร้างข้อมูลผู้ใช้ทั้ง 2 รูปแบบ (แบบ result.user.role หรือ result.role)
          const userRole = result.user ? result.user.role : result.role;
          const username = result.user ? result.user.username : result.username;

          // เซฟ Token และข้อมูลผู้ใช้ลงใน LocalStorage ของเบราว์เซอร์
          localStorage.setItem('token', result.token);
          localStorage.setItem('username', result.username);
          localStorage.setItem('role', result.role);

          // แยกทางไปตามสิทธิ์การใช้งาน
          setTimeout(() => {
            if (userRole === 'admin' || userRole === 'superadmin') {
              window.location.href = '/admin.html'; // ถ้าเป็นแอดมิน ไปหน้าแอดมิน
            } else {
              window.location.href = '/index.html'; // ถ้าเป็นสมาชิกทั่วไป ไปหน้าส่งโพย
            }
          }, 1000);

        } else {
          statusDiv.style.color = 'red';
          statusDiv.innerText = result.message;
        }
      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
      }
    });
  </script>
</body>
</html>
