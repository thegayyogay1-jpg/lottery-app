<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบส่งโพยหวย</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background-color: #218838; }
    #status { margin-top: 15px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <h2>บันทึกโพยหวย</h2>
  <form id="betForm">
    <div class="form-group">
      <label>ชื่อผู้แทง:</label>
      <input type="text" id="playerName" required placeholder="เช่น ตัวอย่าง A">
    </div>
    <div class="form-group">
      <label>ตัวเลข:</label>
      <input type="text" id="number" required placeholder="เช่น 123 หรือ 45">
    </div>
    <div class="form-group">
      <label>ประเภท:</label>
      <select id="betType">
        <option value="3 บน">3 บน</option>
        <option value="3 โต๊ด">3 โต๊ด</option>
        <option value="2 บน">2 บน</option>
        <option value="2 ล่าง">2 ล่าง</option>
      </select>
    </div>
    <div class="form-group">
      <label>จำนวนเงิน (บาท):</label>
      <input type="number" id="amount" min="1" required placeholder="เช่น 100">
    </div>
    <button type="submit">ส่งโพย</button>
  </form>
  <div id="status"></div>

  <script>
    document.getElementById('betForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = 'กำลังบันทึก...';

      const data = {
        playerName: document.getElementById('playerName').value,
        number: document.getElementById('number').value,
        betType: document.getElementById('betType').value,
        amount: document.getElementById('amount').value
      };

      try {
        const response = await fetch('/api/bet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();

        if (result.success) {
          statusDiv.style.color = 'green';
          statusDiv.innerText = 'บันทึกโพยเรียบร้อยแล้ว!';
          document.getElementById('number').value = '';
          document.getElementById('amount').value = '';
        } else {
          statusDiv.style.color = 'red';
          statusDiv.innerText = 'เกิดข้อผิดพลาด: ' + result.message;
        }
      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
      }
    });
  </script>
</body>
</html>
